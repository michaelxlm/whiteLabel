# nginx 站点配置示例（把 your-domain.com 换成你自己的域名，server 端口换成你的 server/index.js 监听端口）
# 静态站点产物目录 dist/ 直接由 nginx 提供；/track 与 /admin/api 反代到本机的白标 Node 服务。

server {
    listen 80;
    server_name your-domain.com;

    root /var/www/white-label/dist;
    index index.html;

    # 公开静态资源：长缓存（构建带指纹，可放心 immutable）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 埋点与管理端 API 反代到本机 Node 服务（默认 8787）
    location /track {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
    location /admin/api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 管理端 SPA 由 nginx 直接提供静态产物（若与 Node 同端口部署，则可整段反代到 Node）
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 公开页：不存在的路径回落 404（静态站无服务端路由）
    location / {
        try_files $uri $uri/ =404;
    }
}
