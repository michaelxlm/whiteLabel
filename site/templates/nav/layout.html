<!DOCTYPE html>
<html lang="{{LANG}}" data-theme="{{THEME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL}}">
  {{HREFLANG}}
  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:site_name" content="{{SITENAME}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/style.css">
  <script>{{THEME_INLINE}}</script>
  {{JSONLD}}
</head>
<body class="tpl-nav">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">{{SITENAME}}</a>
      <nav class="nav">{{NAV}}<button class="theme-toggle" type="button" aria-label="切换主题">◐</button></nav>
    </div>
  </header>
  <main class="wrap">
    {{BODY}}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>© <span id="y"></span> {{SITENAME}}</span>
      <span>{{FOOTER_NOTE}}{{ICP}}</span>
    </div>
  </footer>
  <script>window.__ADS={{{ADS_JSON}}};window.__LANG="{{LANG}}";</script>
  <script src="/assets/license.js"></script>
  <script src="/assets/theme.js"></script>
  <script src="/assets/track.js"></script>
  <script src="/assets/ad-slot.js"></script>
  <script>window.__AIGUIDE={{{AI_GUIDE}}};</script>
  <script src="/assets/ai-assistant.js" defer></script>
  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
